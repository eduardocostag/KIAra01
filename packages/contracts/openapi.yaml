openapi: 3.1.0
info:
  title: Kiara Lead Intelligence API
  version: 1.0.0
  description: Tenant is derived from the verified bearer token and membership; clients never supply organization_id.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/platform/context:
    get:
      operationId: getPlatformContext
      description: Requires the signed identity email claim admin@kiara.local. Read-only structure checks the active organization and persisted membership; legacy personal workspaces remain compatible. Does not modify Leads access or execute integrations.
      responses:
        "200":
          description: Authorized module descriptors for the current organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformContext" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/platform/modules/{module_key}:
    get:
      operationId: getPlatformModule
      description: Requires the signed identity email claim admin@kiara.local. Read-only module structure; direct access to a disabled module is denied. No module executor is activated.
      parameters:
        - name: module_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorized module and current organization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformModuleDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/platform/skills:
    get:
      operationId: listPlatformSkills
      description: Requires the signed identity email claim admin@kiara.local. Packaged OperationalSkills catalog filtered by authorized modules. References remain untrusted and executors inactive.
      responses:
        "200":
          description: Reference metadata without executable content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSkills" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/platform/portfolio:
    get:
      operationId: getPlatformPortfolio
      description: Requires the signed identity email claim admin@kiara.local. Returns server-assigned customer organization IDs only; no implicit operational access to customer data.
      responses:
        "200":
          description: Explicitly assigned portfolio metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformPortfolio" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Healthy" }
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Healthy" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Verified identity and active organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        default: { $ref: "#/components/responses/Error" }
  /v1/inbox/threads:
    get:
      operationId: listInboxThreads
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Cursor page scoped to the active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
  /v1/inbox/threads/{thread_id}:
    get:
      operationId: getInboxThread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread, messages, consumer and qualification
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadDetail" }
        default: { $ref: "#/components/responses/Error" }
  /v1/inbox/threads/{thread_id}/drafts:
    post:
      operationId: createMessageDraft
      description: Creates a draft and never sends a message.
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftCreate" }
      responses:
        "201":
          description: Created or original response on identical retry
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDraft" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/drafts/{draft_id}/approve:
    post:
      operationId: approveMessageDraft
      description: Approval binds to the current version and content hash; it does not send.
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Approved or original response on identical retry
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDraft" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/threads/{thread_id}/qualify:
    post:
      operationId: qualifyThread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationRequest" }
      responses:
        "200":
          description: Qualification completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Qualification" }
        "202":
          description: Qualification queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/pipeline:
    get:
      operationId: listPipelineEntries
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Cursor page scoped to active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelinePage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/pipeline/{entry_id}:
    patch:
      operationId: updatePipelineEntry
      parameters:
        - $ref: "#/components/parameters/PipelineEntryId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PipelineUpdate" }
      responses:
        "200":
          description: Updated or original response on identical retry
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineEntry" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/dashboard:
    get:
      operationId: getSocialDashboard
      responses:
        "200": { description: Tenant-scoped social channels, posts and capabilities }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/channels:
    get:
      operationId: listSocialChannels
      responses:
        "200": { description: Tenant-scoped social channels }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSocialChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { description: Simulated channel created }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/media:
    post:
      operationId: uploadSocialMedia
      parameters:
        - name: X-Kiara-Filename
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 760 }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Binary media stored privately }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/media/{media_id}/download:
    get:
      operationId: downloadSocialMedia
      parameters:
        - name: media_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Private media download }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/posts:
    get:
      operationId: listSocialPosts
      responses:
        "200": { description: Tenant-scoped social posts }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSocialPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { description: Draft, schedule or simulated publication created }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/posts/{post_id}/package:
    get:
      operationId: getSocialPublicationPackage
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Assisted delivery package with caption and private media links }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/posts/{post_id}/publish:
    post:
      operationId: simulateSocialPost
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { description: Publication simulated without an external network request }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/posts/{post_id}/confirm:
    post:
      operationId: confirmAssistedSocialPublication
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: User-confirmed publication URL recorded }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/social/posts/{post_id}:
    put:
      operationId: updateSocialPost
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel_ids]
              properties:
                content: { type: string, maxLength: 10000, default: "" }
                channel_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string }
                media_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string }
                action: { type: string, enum: [draft, schedule, prepare], default: draft }
                scheduled_at: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Existing tenant-scoped post updated with an incremented version }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSocialPost
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Draft deleted or publication evidence cancelled }
        default: { $ref: "#/components/responses/Error" }
  /v1/instagram/skills:
    get:
      tags:
      - instagram-content
      summary: Catalog
      operationId: catalog_v1_instagram_skills_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/instagram/skills/{name}:
    get:
      tags:
      - instagram-content
      summary: Read Skill
      operationId: read_skill_v1_instagram_skills__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: resource
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
          default: SKILL.md
          title: Resource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/instagram/content-check:
    post:
      tags:
      - instagram-content
      summary: Content Check
      operationId: content_check_v1_instagram_content_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentCheckInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/config:
    get:
      tags:
      - whatsapp-web
      summary: Get Config
      operationId: get_config_v1_whatsapp_web_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - whatsapp-web
      summary: Put Config
      operationId: put_config_v1_whatsapp_web_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/events:
    post:
      tags:
      - whatsapp-web
      summary: Post Events
      operationId: post_events_v1_whatsapp_web_events_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - whatsapp-web
      summary: Get Events
      operationId: get_events_v1_whatsapp_web_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/analysis:
    post:
      tags:
      - whatsapp-web
      summary: Request Analysis
      operationId: request_analysis_v1_whatsapp_web_analysis_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/analysis/next:
    get:
      tags:
      - whatsapp-web
      summary: Next Analysis
      operationId: next_analysis_v1_whatsapp_web_analysis_next_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/analysis/{job_id}:
    get:
      tags:
      - whatsapp-web
      summary: Analysis Status
      operationId: analysis_status_v1_whatsapp_web_analysis__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
  /v1/whatsapp-web/analysis/{job_id}/complete:
    post:
      tags:
      - whatsapp-web
      summary: Complete Analysis
      operationId: complete_analysis_v1_whatsapp_web_analysis__job_id__complete_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCompletion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 512 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OpaqueId" }
    DraftId:
      name: draft_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OpaqueId" }
    PipelineEntryId:
      name: entry_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OpaqueId" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per tenant and operation; retained at least 24 hours.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9._~-]+$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from the previous read or mutation.
      schema: { type: string }
  headers:
    ETag:
      description: Strong resource-version ETag.
      schema: { type: string }
    RateLimitInteger:
      schema: { type: integer }
  responses:
    Healthy:
      description: Healthy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HealthStatus" }
    Error:
      description: Error; HTTP status retains standard meaning
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitInteger" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitInteger" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitInteger" }
        Retry-After: { $ref: "#/components/headers/RateLimitInteger" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    PlatformModule:
      type: object
      required: [key, name, description, href, status, status_label, enabled, areas, integration_status]
      properties:
        key: { type: string, enum: [leads, whatsapp, atendimento, ti] }
        name: { type: string }
        description: { type: string }
        href: { type: string }
        status: { type: string, enum: [operational, preparation] }
        status_label: { type: string }
        enabled: { type: boolean, const: true }
        areas: { type: array, items: { type: string } }
        integration_status: { type: string, enum: [existing, pending] }
    PlatformContext:
      type: object
      required: [brand, organization, membership, platform_role, modules, phase, external_execution_enabled, access_source]
      properties:
        brand: { type: string, const: KIARA }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        membership:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string, enum: [owner, admin, operator, viewer] }
        platform_role: { type: string, enum: [client, reseller, platform_admin] }
        modules: { type: array, items: { $ref: "#/components/schemas/PlatformModule" } }
        phase: { type: string, const: structure_only }
        external_execution_enabled: { type: boolean, const: false }
        access_source: { type: string, enum: [persisted_membership, legacy_personal_workspace] }
    PlatformModuleDetail:
      allOf:
        - $ref: "#/components/schemas/PlatformContext"
        - type: object
          required: [module, execution_status]
          properties:
            module: { $ref: "#/components/schemas/PlatformModule" }
            execution_status: { type: string, const: inactive }
    PlatformSkills:
      type: object
      required: [items, phase, external_execution_enabled]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, description, modules, trust, executor_status]
            properties:
              name: { type: string }
              description: { type: string }
              modules: { type: array, items: { type: string, enum: [leads, whatsapp, atendimento, ti] } }
              trust: { type: string, const: untrusted_reference }
              executor_status: { type: string, const: inactive }
        phase: { type: string, const: structure_only }
        external_execution_enabled: { type: boolean, const: false }
    PlatformPortfolio:
      type: object
      required: [items, platform_role, scope, external_execution_enabled]
      properties:
        items:
          type: array
          items:
            type: object
            required: [organization_id]
            properties:
              organization_id: { type: string }
        platform_role: { type: string, enum: [reseller, platform_admin] }
        scope: { type: string, const: assigned_metadata_only }
        external_execution_enabled: { type: boolean, const: false }
    OpaqueId: { type: string, minLength: 10, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
    Timestamp: { type: string, format: date-time }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user_id, membership_id, organization, role, capabilities]
      properties:
        user_id: { $ref: "#/components/schemas/OpaqueId" }
        membership_id: { $ref: "#/components/schemas/OpaqueId" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, operator, viewer] }
        capabilities:
          type: array
          description: Extensible; clients must tolerate unknown values.
          items: { type: string }
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string }
    Consumer:
      type: object
      additionalProperties: false
      required: [id, display_name, instagram_username]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        display_name: { type: string, maxLength: 120 }
        instagram_username: { type: [string, "null"], maxLength: 64 }
        phone: { type: [string, "null"] }
        whatsapp_url: { type: [string, "null"], format: uri }
        source_url: { type: [string, "null"], format: uri }
        source: { type: [string, "null"] }
        website_status: { type: [string, "null"] }
        website_url: { type: [string, "null"], format: uri }
        address: { type: [string, "null"] }
        research_query: { type: [string, "null"] }
        search_id: { type: [string, "null"] }
        location: { type: [string, "null"] }
        website_evidence: { type: [string, "null"] }
        criterion_status: { type: [string, "null"] }
    ThreadSummary:
      type: object
      additionalProperties: false
      required: [id, consumer, status, unread_count, updated_at, version]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        consumer: { $ref: "#/components/schemas/Consumer" }
        status: { type: string, enum: [open, waiting_customer, waiting_operator, resolved] }
        unread_count: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        version: { type: integer, minimum: 1 }
    ThreadPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ThreadSummary" } }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    ThreadDetail:
      allOf:
        - { $ref: "#/components/schemas/ThreadSummary" }
        - type: object
          required: [messages, drafts]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
            drafts: { type: array, items: { $ref: "#/components/schemas/MessageDraft" } }
            qualification:
              oneOf: [{ $ref: "#/components/schemas/Qualification" }, { type: "null" }]
    Message:
      type: object
      required: [id, direction, text, created_at]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        direction: { type: string, enum: [inbound, outbound] }
        text: { type: string, maxLength: 4000 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    DraftCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
    MessageDraft:
      type: object
      required: [id, thread_id, text, status, version, content_hash, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        thread_id: { $ref: "#/components/schemas/OpaqueId" }
        text: { type: string, maxLength: 1000 }
        status: { type: string, enum: [draft, approved, invalidated] }
        version: { type: integer, minimum: 1 }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    QualificationRequest:
      type: object
      additionalProperties: false
      properties:
        force_refresh: { type: boolean, default: false }
    Qualification:
      type: object
      required: [id, thread_id, score, temperature, recommendation, created_at]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        thread_id: { $ref: "#/components/schemas/OpaqueId" }
        score: { type: integer, minimum: 0, maximum: 100 }
        temperature: { type: string, enum: [cold, warm, hot] }
        recommendation: { type: string, maxLength: 500 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    JobReference:
      type: object
      required: [job_id, status]
      properties:
        job_id: { $ref: "#/components/schemas/OpaqueId" }
        status: { type: string, enum: [queued] }
    PipelineStage: { type: string, enum: [new, qualified, contacted, opportunity, won, lost] }
    PipelineEntry:
      type: object
      required: [id, consumer, stage, version, updated_at]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        consumer: { $ref: "#/components/schemas/Consumer" }
        stage: { $ref: "#/components/schemas/PipelineStage" }
        next_action: { type: [string, "null"], maxLength: 500 }
        version: { type: integer, minimum: 1 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PipelinePage:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PipelineEntry" } }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    PipelineUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        stage: { $ref: "#/components/schemas/PipelineStage" }
        next_action: { type: [string, "null"], maxLength: 500 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ApiError" }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        message: { type: string, maxLength: 500 }
        request_id: { type: string, minLength: 10, maxLength: 64 }
        details: { type: object, additionalProperties: true }
    ContentCheckInput:
      properties:
        operation:
          type: string
          enum:
          - hookscore
          - beats
          - caption
          - humanize
          - detect
          - swipe
          title: Operation
        text:
          type: string
          maxLength: 12000
          title: Text
          default: ''
        target_seconds:
          anyOf:
          - type: number
            maximum: 600.0
            minimum: 1.0
          - type: 'null'
          title: Target Seconds
        wpm:
          type: number
          maximum: 300.0
          minimum: 60.0
          title: Wpm
          default: 165
        keywords:
          items:
            type: string
            maxLength: 100
          type: array
          maxItems: 20
          title: Keywords
        reels:
          items:
            $ref: '#/components/schemas/ReelInput'
          type: array
          maxItems: 100
          title: Reels
      additionalProperties: false
      type: object
      required:
      - operation
      title: ContentCheckInput
    ReelInput:
      properties:
        account:
          type: string
          maxLength: 1000
          minLength: 1
          title: Account
        hook:
          type: string
          maxLength: 1000
          minLength: 1
          title: Hook
        views:
          type: integer
          maximum: 1000000000000.0
          minimum: 0.0
          title: Views
        median:
          anyOf:
          - type: integer
            maximum: 1000000000000.0
            minimum: 0.0
          - type: 'null'
          title: Median
        followers:
          anyOf:
          - type: integer
            maximum: 1000000000000.0
            minimum: 0.0
          - type: 'null'
          title: Followers
      additionalProperties: false
      type: object
      required:
      - account
      - hook
      - views
      title: ReelInput
    WhatsAppConfig:
      properties:
        pilot_mode:
          type: boolean
          title: Pilot Mode
          default: true
        pilot_consent_confirmed:
          type: boolean
          title: Pilot Consent Confirmed
          default: false
        enabled:
          type: boolean
          title: Enabled
          default: false
        auto_reply_enabled:
          type: boolean
          title: Auto Reply Enabled
          default: true
        followup_enabled:
          type: boolean
          title: Followup Enabled
          default: false
        daily_limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Daily Limit
          default: 50
        initial_outreach_enabled:
          type: boolean
          title: Initial Outreach Enabled
          default: false
        outreach_template:
          type: string
          maxLength: 4000
          minLength: 1
          title: Outreach Template
          default: Olá {name}! Posso apresentar como podemos ajudar?
        ai_context:
          type: string
          maxLength: 6000
          title: Ai Context
          default: ''
        reply_template:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reply Template
          default: Olá {name}! Recebemos sua mensagem. Como podemos ajudar?
        followup_template:
          type: string
          maxLength: 4000
          minLength: 1
          title: Followup Template
          default: Olá {name}! Podemos ajudar com mais alguma informação?
        followup_hours:
          type: integer
          maximum: 720.0
          minimum: 1.0
          title: Followup Hours
          default: 24
        contact_start:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          title: Contact Start
          default: 09:00
        contact_end:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          title: Contact End
          default: '18:00'
        contacts:
          items:
            $ref: '#/components/schemas/Contact'
          type: array
          maxItems: 500
          title: Contacts
      additionalProperties: false
      type: object
      title: WhatsAppConfig
    Contact:
      properties:
        phone:
          type: string
          pattern: ^[1-9][0-9]{7,14}$
          title: Phone
        name:
          type: string
          maxLength: 160
          title: Name
          default: ''
        enabled:
          type: boolean
          title: Enabled
          default: true
        handoff:
          type: boolean
          title: Handoff
          default: false
      additionalProperties: false
      type: object
      required:
      - phone
      title: Contact
    EventBatch:
      properties:
        events:
          items:
            $ref: '#/components/schemas/WhatsAppEvent'
          type: array
          maxItems: 100
          minItems: 1
          title: Events
      additionalProperties: false
      type: object
      required:
      - events
      title: EventBatch
    WhatsAppEvent:
      properties:
        id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9._:~-]+$
          title: Id
        phone:
          type: string
          pattern: ^(?:[1-9][0-9]{7,14})?$
          title: Phone
          default: ''
        kind:
          type: string
          enum:
          - inbound
          - outbound
          - outbound_observed
          - heartbeat
          - error
          - unknown
          - handoff
          - followup
          - cancelled
          title: Kind
        text:
          type: string
          maxLength: 10000
          title: Text
          default: ''
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        status:
          type: string
          maxLength: 80
          title: Status
          default: ''
        external_message_id:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: External Message Id
        conversation_id:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Conversation Id
        direction:
          anyOf:
          - type: string
            enum:
            - in
            - out
            - inbound
            - outbound
          - type: 'null'
          title: Direction
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - occurred_at
      title: WhatsAppEvent
    AnalysisRequest:
      properties:
        limit:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Limit
          default: 30
      additionalProperties: false
      type: object
      title: AnalysisRequest
    AnalysisCompletion:
      properties:
        leads:
          items:
            $ref: '#/components/schemas/AnalysisLead'
          type: array
          maxItems: 30
          title: Leads
        scanned:
          type: integer
          maximum: 30.0
          minimum: 0.0
          title: Scanned
          default: 0
        skipped:
          type: integer
          maximum: 30.0
          minimum: 0.0
          title: Skipped
          default: 0
        error:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Error
      additionalProperties: false
      type: object
      title: AnalysisCompletion
    AnalysisLead:
      properties:
        phone:
          type: string
          pattern: ^[1-9][0-9]{7,14}$
          title: Phone
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
        stage:
          type: string
          enum:
          - new
          - qualified
          - contacted
          - opportunity
          - won
          - lost
          title: Stage
          default: new
        summary:
          type: string
          maxLength: 2000
          title: Summary
          default: ''
        next_action:
          type: string
          maxLength: 300
          title: Next Action
          default: ''
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
      additionalProperties: false
      type: object
      required:
      - phone
      - name
      - confidence
      title: AnalysisLead
