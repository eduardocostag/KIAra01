<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kiara — Coletor Público</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><span class="orb">··</span><div><strong>KIARA</strong><small>Coletor público</small></div></header>
      <p class="intro">Abra seguidores ou comentários no Instagram, role a lista e capture os perfis já exibidos.</p>
      <section><b id="count">0</b><span>perfis guardados neste navegador</span></section>
      <p id="status" role="status" aria-live="polite">Nenhum dado de login é lido ou enviado.</p>
      <button id="capture" class="primary">Capturar perfis carregados</button>
      <div class="actions"><button id="copy">Copiar para a Kiara</button><button id="clear">Limpar</button></div>
      <small class="privacy">Somente nomes, usuários e links públicos visíveis na aba atual.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
