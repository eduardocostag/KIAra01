name: kiara-chatwoot

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.1-ce@sha256:04895c7bd0550d9e74b45b7202787b56f7ee4e891ebbde0c429c8c32901b97cf
  restart: unless-stopped
  volumes:
    - storage_data:/app/storage
  environment: &chatwoot_environment
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?Provide CHATWOOT_SECRET_KEY_BASE in process environment}
    FRONTEND_URL: http://127.0.0.1:3005
    FORCE_SSL: "false"
    ENABLE_ACCOUNT_SIGNUP: "false"
    ENABLE_PUSH_RELAY_SERVER: "false"
    DEFAULT_LOCALE: pt_BR
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?Provide CHATWOOT_POSTGRES_PASSWORD in process environment}
    REDIS_URL: redis://redis:6379
    REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?Provide CHATWOOT_REDIS_PASSWORD in process environment}
    ACTIVE_STORAGE_SERVICE: local
    RAILS_LOG_TO_STDOUT: "true"
    LOG_LEVEL: info
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  rails:
    <<: *chatwoot
    ports:
      - "127.0.0.1:3005:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, "3000", -b, 0.0.0.0]

  sidekiq:
    <<: *chatwoot
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]

  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?Provide CHATWOOT_POSTGRES_PASSWORD in process environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?Provide CHATWOOT_REDIS_PASSWORD in process environment}
      REDISCLI_AUTH: ${CHATWOOT_REDIS_PASSWORD:?Provide CHATWOOT_REDIS_PASSWORD in process environment}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  storage_data:
  postgres_data:
  redis_data:
