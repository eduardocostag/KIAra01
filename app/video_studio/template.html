<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kiara Video Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05040b; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; color: white; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #05040b; }
  .blob { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(140px); opacity: .55; }
  #grid { position: absolute; left: -50%; right: -50%; top: 46%; height: 120%; background-image: linear-gradient(rgb(170 130 255 / .14) 1px, transparent 1px), linear-gradient(90deg, rgb(170 130 255 / .14) 1px, transparent 1px); background-size: 80px 80px; transform-origin: 50% 0; mask-image: linear-gradient(to bottom, transparent, black 30%, transparent 85%); }
  .particle { position: absolute; left: 0; top: 0; border-radius: 50%; background: #d8c6ff; box-shadow: 0 0 10px #a78bfa; }
  .spark { position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 50%; background: white; box-shadow: 0 0 12px var(--c, #c4a1ff), 0 0 24px var(--c, #c4a1ff); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .65) 100%); z-index: 60; }
  #flash { position: absolute; inset: 0; z-index: 55; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgb(210 180 255 / .9), rgb(124 77 255 / .35) 35%, transparent 70%); opacity: 0; mix-blend-mode: screen; }
  .streak { position: absolute; height: 2px; width: 900px; background: linear-gradient(90deg, transparent, rgb(220 200 255 / .9), transparent); z-index: 54; opacity: 0; }
  .scene { position: absolute; inset: 0; display: none; transform-origin: 50% 50%; }
  .kicker { position: absolute; top: 62px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 24px var(--accent); }
  .kicker::after { content: ""; display: block; height: 2px; margin: 14px auto 0; width: calc(var(--line, 0) * 240px); background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .window { position: absolute; left: 50%; top: 150px; width: 1300px; height: 762px; margin-left: -650px; border-radius: 20px; overflow: hidden; border: 1px solid rgb(255 255 255 / .14); background: #0b0a14; box-shadow: 0 70px 140px -40px rgb(0 0 0 / .95), 0 0 120px -30px var(--accent); }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #14121f; border-bottom: 1px solid rgb(255 255 255 / .06); position: relative; z-index: 3; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a3550; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar span { margin-left: 18px; padding: 4px 16px; border-radius: 8px; background: rgb(255 255 255 / .05); color: rgb(255 255 255 / .55); font-size: 14px; }
  .viewport { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .layer img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 30px var(--accent), inset 0 0 30px var(--accent); }
  .spotPulse { position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--accent); }
  .glare { position: absolute; top: 0; bottom: 0; width: 360px; background: linear-gradient(100deg, transparent, rgb(255 255 255 / .16), transparent); z-index: 4; pointer-events: none; }
  .reflection { position: absolute; left: 50%; top: 925px; width: 1300px; height: 120px; margin-left: -650px; border-radius: 20px; background: linear-gradient(to bottom, rgb(124 77 255 / .18), transparent); filter: blur(10px); }
  .card { position: absolute; right: 56px; width: 410px; display: flex; align-items: center; gap: 16px; padding: 20px 22px; border-radius: 22px; background: linear-gradient(145deg, rgb(40 30 78 / .95), rgb(15 13 30 / .93)); box-shadow: 0 34px 70px -26px rgb(0 0 0 / .9); font-size: 23px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; z-index: 20; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: conic-gradient(from var(--spin, 0deg), transparent 0 60%, var(--accent) 75%, transparent 90%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgb(255 255 255 / .1); }
  .card b { position: relative; flex-shrink: 0; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; background: color-mix(in oklab, var(--accent) 28%, transparent); color: white; box-shadow: 0 0 22px var(--accent); }
  .card .shine { position: absolute; top: 0; bottom: 0; width: 120px; background: linear-gradient(100deg, transparent, rgb(255 255 255 / .22), transparent); }
  .caption { position: absolute; left: 50%; bottom: 40px; max-width: 1300px; transform: translateX(-50%); padding: 13px 28px; border-radius: 18px; background: rgb(7 6 14 / .82); border: 1px solid rgb(255 255 255 / .08); font-size: 29px; line-height: 1.35; text-align: center; z-index: 40; white-space: normal; }
  .caption span { color: rgb(255 255 255 / .42); transition: none; }
  .caption span.on { color: white; }
  .caption span.now { color: var(--accent); text-shadow: 0 0 18px var(--accent); }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; z-index: 70; background: linear-gradient(90deg, #7c4dff, #38bdf8, #f0abfc); box-shadow: 0 0 16px #7c4dff; }
  #brand { position: absolute; top: 40px; left: 52px; display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .26em; font-size: 19px; z-index: 65; }
  #brand em { font-style: normal; }
  #brand span { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 40% 28%, #e7d4ff, #8b4dff 50%, #2e135e 95%); box-shadow: 0 0 16px #7c4dff; }
  #forWho { position: absolute; top: 40px; right: 52px; z-index: 65; font-size: 17px; color: rgb(255 255 255 / .6); letter-spacing: .04em; }
  #forWho b { color: white; }
  /* Presenter */
  #presenter { position: absolute; left: 0; top: 0; z-index: 35; }
  #aura { position: absolute; border-radius: 50%; filter: blur(36px); }
  #bars { position: absolute; overflow: visible; }
  .sat { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, white, var(--accent) 45%, #2e135e 100%); box-shadow: 0 0 16px var(--accent); }
  .shock { position: absolute; border-radius: 50%; border: 2px solid var(--accent); }
  #orb { position: absolute; border-radius: 50%; overflow: hidden; border: 1.5px solid rgb(225 190 255 / .65); background: radial-gradient(circle at 42% 14%, rgb(252 232 255 / .95), transparent 15%), radial-gradient(circle at 39% 30%, #cfa6ff 1%, #a061ef 25%, #6522bf 56%, #2a1157 88%); display: grid; place-items: center; }
  #sheen { position: absolute; inset: -20%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 60%, rgb(255 255 255 / .2) 72%, transparent 84%); }
  #scan { position: absolute; left: 0; right: 0; height: 18%; background: linear-gradient(to bottom, transparent, rgb(255 255 255 / .1), transparent); }
  #rim { position: absolute; inset: 0; border-radius: 50%; }
  #face { position: relative; display: flex; flex-direction: column; align-items: center; width: 30%; }
  #eyes { display: flex; width: 80%; gap: 26%; justify-content: center; }
  #eyes i { display: block; width: 30%; aspect-ratio: .68; border-radius: 50%; background: #10041f; }
  #eyes.happy i { aspect-ratio: 1.6; background: transparent; border-top: .32em solid #10041f; border-radius: 60% 60% 0 0 / 100% 100% 0 0; }
  #mouth { margin-top: 12%; width: 26%; border-radius: 0 0 40px 40px; background: #10041f; }
  #name { position: absolute; white-space: nowrap; font-size: 18px; font-weight: 800; letter-spacing: .24em; color: #e2d4ff; transform: translateX(-50%); text-shadow: 0 0 16px #7c4dff; }
  /* Orb-centred scenes */
  .big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.045em; }
  .grad { background: linear-gradient(90deg, #c4a1ff, #7dd3fc, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .person { position: absolute; top: 690px; font-size: 120px; font-weight: 800; letter-spacing: -.04em; background: linear-gradient(180deg, #ffffff, #c4a1ff 70%, #7c4dff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgb(124 77 255 / .8)); }
  .pill { position: absolute; left: 50%; padding: 14px 30px; border-radius: 999px; border: 1px solid rgb(196 161 255 / .45); background: rgb(30 22 58 / .85); font-size: 24px; font-weight: 600; white-space: nowrap; box-shadow: 0 0 40px rgb(124 77 255 / .35); }
  .tile { position: absolute; width: 230px; height: 150px; margin: -75px 0 0 -115px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 22px; font-weight: 700; background: linear-gradient(150deg, rgb(40 30 78 / .95), rgb(15 13 30 / .95)); border: 1px solid rgb(255 255 255 / .14); box-shadow: 0 30px 60px -20px rgb(0 0 0 / .9), 0 0 50px -10px var(--tone); }
  .tile i { width: 46px; height: 46px; border-radius: 14px; background: var(--tone); box-shadow: 0 0 24px var(--tone); }
  .tile.new { border: 2px dashed #f0abfc; background: linear-gradient(150deg, rgb(70 30 90 / .95), rgb(25 13 40 / .95)); }
  .tile.new i { background: none; box-shadow: none; display: grid; place-items: center; font-style: normal; font-size: 44px; color: #f0abfc; }
  .shield { position: absolute; left: 960px; top: 470px; border-radius: 50%; border: 3px solid #7dd3fc; box-shadow: 0 0 40px #7dd3fc, inset 0 0 40px rgb(125 211 252 / .4); }
  .cta { position: absolute; left: 50%; padding: 20px 40px; border-radius: 18px; background: linear-gradient(90deg, #7c4dff, #9f7aff); font-size: 28px; font-weight: 800; box-shadow: 0 24px 70px -10px rgb(124 77 255 / .9); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <div id="grid"></div>
  <div id="particles"></div>
  <div id="scenes"></div>
  <div id="sparks"></div>
  <div id="presenter">
    <div id="aura"></div><svg id="bars"></svg>
    <div class="shock"></div><div class="shock"></div><div class="shock"></div>
    <div class="sat"></div><div class="sat"></div><div class="sat"></div>
    <div id="orb"><div id="sheen"></div><div id="scan"></div><div id="rim"></div><div id="face"><div id="eyes"><i></i><i></i></div><div id="mouth"></div></div></div>
    <div id="name">KIARA</div>
  </div>
  <div class="streak" id="s1"></div><div class="streak" id="s2"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="brand"><span></span><em></em></div>
  <div id="forWho"></div>
  <div id="progress"></div>
</div>
<script src="timeline.js"></script>
<script>
const T = window.TIMELINE, W = 1920, H = 1080
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3)
const easeInOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const lerp = (a, b, k) => a + (b - a) * k
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})` }
let seed = 11
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647

const scenes = T.scenes.map((scene, i) => ({ ...scene, vStart: i === 0 ? 0 : scene.start - .4, vEnd: i + 1 < T.scenes.length ? T.scenes[i + 1].start - .4 : T.duration }))
const root = document.getElementById("scenes")
const META = T.meta || {}
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const color = (v, fallback) => /^#[0-9a-fA-F]{6}$/.test(v || "") ? v : fallback
const TILES = [["Leads", "#38bdf8"], ["WhatsApp", "#34d399"], ["Chat", "#c4a1ff"], ["Automation", "#facc15"]]
const AUDIENCE = (META.audience || []).slice(0, 3)
document.querySelector("#brand em").textContent = META.brand || "KIARA"
document.getElementById("forWho").innerHTML = AUDIENCE.length ? `${esc(META.for_label || "Apresentação para")} ${AUDIENCE.map((n) => `<b>${esc(n)}</b>`).join(AUDIENCE.length === 2 ? " e " : ", ")}` : ""

// ---------- Build scenes ----------
for (const scene of scenes) {
  const el = document.createElement("div"); el.className = "scene"; scene.accent = color(scene.accent, "#a78bfa"); el.style.setProperty("--accent", scene.accent); scene.el = el
  const words = scene.caption.split(/\s+/)
  // Split into short chunks (sentence / comma boundaries) so captions stay on one or two lines.
  scene.chunkOf = []; let chunk = 0, length = 0
  words.forEach((w, i) => { scene.chunkOf.push(chunk); length += w.length + 1; if ((/[.!?]$/.test(w) && length > 25) || (/[,:]$/.test(w) && length > 48) || length > 80) { chunk += 1; length = 0 } })
  const caption = `<div class="caption">${words.map((w) => `<span>${esc(w)}</span>`).join(" ")}</div>`
  if (scene.layout === "shot") {
    el.innerHTML = `<div class="kicker">${esc(scene.kicker)}</div><div class="reflection"></div>
      <div class="window"><div class="bar"><i></i><i></i><i></i><span>${esc(META.app_label || "app.kiara")} · ${esc(scene.kicker)}</span></div><div class="viewport">
      ${scene.shots.map((s) => `<div class="layer"><img src="../shots/${encodeURIComponent(s.shot)}.png"></div>`).join("")}
      ${(scene.spots || []).map(() => `<div class="spot"><div class="spotPulse"></div></div>`).join("")}</div><div class="glare"></div></div>
      ${(scene.cards || []).map((c, i) => `<div class="card" style="top:${280 + i * 124}px;${scene.cardsSide === "left" ? "left:56px;right:auto" : ""}"><b>${i + 1}</b><span>${esc(c.text)}</span><div class="shine"></div></div>`).join("")}${caption}`
  } else if (scene.layout === "hello") {
    const names = scene.words || [], spots = [[960], [500, 1440], [420, 960, 1500]][Math.max(0, names.length - 1)] || []
    el.innerHTML = `<div class="big" style="top:62px;font-size:44px;font-weight:600;letter-spacing:-.02em;color:rgb(255 255 255 / .75)">${esc(scene.greeting || "Olá,")}</div>
      ${names.slice(0, 3).map((w, n) => `<div class="person" style="left:${spots[n]}px;font-size:${names.length > 2 ? 92 : 120}px">${esc(w.text)}</div>`).join("")}
      ${scene.pill === "" ? "" : `<div class="pill" style="top:900px">${esc(scene.pill || "Uma apresentação exclusiva para vocês")}</div>`}${caption}`
  } else if (scene.layout === "orb") {
    el.innerHTML = (scene.words || []).map((w) => `<div class="card" style="right:auto;width:auto;padding:16px 24px"><b>✦</b><span>${esc(w.text)}</span><div class="shine"></div></div>`).join("") + caption
  } else if (scene.layout === "custom") {
    scene.tileList = (scene.tiles || TILES.map(([text, tone]) => ({ text, color: tone }))).slice(0, 6)
    el.innerHTML = `<div class="kicker">${esc(scene.kicker || "Feita sob medida")}</div>` + scene.tileList.map((tile) => `<div class="tile" style="--tone:${color(tile.color, scene.accent)}"><i></i>${esc(tile.text)}</div>`).join("") +
      (scene.new_tile === "" ? "" : `<div class="tile new"><i>+</i>${esc(scene.new_tile || "Novo módulo")}</div>`) + (scene.cards || []).map((c) => `<div class="pill" style="top:830px">${esc(c.text)}</div>`).join("") + caption
  } else if (scene.layout === "control") {
    el.innerHTML = `<div class="kicker">${esc(scene.kicker || scene.title || "")}</div><div class="shield"></div><div class="shield"></div>` + (scene.cards || []).map((c) => `<div class="pill">${esc(c.text)}</div>`).join("") + caption
  } else if (scene.layout === "outro") {
    const lines = String(scene.title || "").split(/(?<=[.!?])\s+/).filter(Boolean), first = lines.slice(0, -1).join(" "), last = lines[lines.length - 1] || ""
    el.innerHTML = `<div class="big" style="top:${first ? 640 : 700}px;font-size:${Math.max(56, 92 - Math.max(0, String(scene.title || "").length - 32))}px">${first ? esc(first) + "<br>" : ""}<span class="grad">${esc(last)}</span></div>` +
      (META.cta ? `<div class="cta" style="top:905px">${esc(META.cta)}</div>` : "")
  }
  scene.captionWords = [...el.querySelectorAll(".caption span")]
  const total = words.reduce((s, w) => s + w.length + 1, 0); let acc = 0
  scene.wordTimes = words.map((w) => { const at = scene.start + (scene.end - scene.start) * (acc / total); acc += w.length + 1; return at })
  root.appendChild(el)
}

// ---------- Ambient ----------
const particles = [], pbox = document.getElementById("particles")
for (let i = 0; i < 90; i++) { const p = document.createElement("div"); p.className = "particle"; pbox.appendChild(p); const z = rand(); particles.push({ el: p, x: rand() * W, y: rand() * H, z, phase: rand() * 6.3 }) }
const sparks = [], sbox = document.getElementById("sparks")
for (let i = 0; i < 70; i++) { const s = document.createElement("div"); s.className = "spark"; sbox.appendChild(s); sparks.push({ el: s, angle: rand() * 6.283, speed: 220 + rand() * 520, life: .7 + rand() * .8 }) }
// Burst moments: every card/word cue and every scene start.
const bursts = []
for (const scene of scenes) { bursts.push({ t: scene.start, strong: true }); for (const c of [...(scene.cards || []), ...(scene.words || [])]) bursts.push({ t: c.at, strong: false }) }

// ---------- Presenter ----------
const presenter = document.getElementById("presenter"), orb = document.getElementById("orb"), aura = document.getElementById("aura"), bars = document.getElementById("bars")
const eyes = document.getElementById("eyes"), mouth = document.getElementById("mouth"), face = document.getElementById("face"), nameTag = document.getElementById("name")
const sats = [...document.querySelectorAll(".sat")], shocks = [...document.querySelectorAll(".shock")]
const NB = 72
bars.innerHTML = Array.from({ length: NB }, () => `<line stroke-linecap="round" stroke-width="4"></line>`).join(""); const lines = [...bars.querySelectorAll("line")]
const POSE = { hello: [960, 420, 300], orb: [960, 470, 340], shot: [176, 870, 150], custom: [960, 470, 220], control: [960, 470, 230], outro: [960, 370, 280] }
const pose = (scene) => POSE[scene.layout] || POSE.shot

function renderPresenter(t, level, current, previous, accent) {
  const k = easeInOut((t - current.vStart) / 1.1)
  const [ax, ay, as] = pose(previous), [bx, by, bs] = pose(current)
  const x = lerp(ax, bx, k), y = lerp(ay, by, k) + Math.sin(t * 1.5) * 7, size = lerp(as, bs, k)
  // Look toward the newest card/word on screen.
  const items = [...(current.cards || []), ...(current.words || [])].filter((c) => c.at <= t)
  const lookAt = items.length && current.layout === "shot" ? (current.cardsSide === "left" ? [-.5, -.4] : [.7, -.35]) : [Math.sin(t * .45) * .3, Math.sin(t * .31) * .18]
  const s = 1 + level * .13
  Object.assign(orb.style, { width: `${size}px`, height: `${size}px`, left: `${x - size / 2}px`, top: `${y - size / 2}px`, transform: `scale(${s}) rotate(${Math.sin(t * .8) * 4}deg)`,
    boxShadow: `inset 20px 18px 44px rgb(253 216 255 / .24), inset -44px -48px 70px rgb(26 5 59 / .74), 0 0 ${40 + level * 90}px ${accent}, 0 0 ${size * .7}px rgb(95 38 187 / .5)` })
  document.getElementById("rim").style.boxShadow = `inset 0 0 ${18 + level * 30}px ${accent}`
  document.getElementById("sheen").style.transform = `rotate(${t * 40}deg)`
  document.getElementById("scan").style.top = `${((t * 0.45) % 1.3) * 100 - 15}%`
  const as2 = size * (2.1 + level * .7)
  Object.assign(aura.style, { width: `${as2}px`, height: `${as2}px`, left: `${x - as2 / 2}px`, top: `${y - as2 / 2}px`, background: `radial-gradient(circle, ${accent}, transparent 62%)`, opacity: (.45 + level * .5).toFixed(3) })
  // Circular audio visualizer.
  const r0 = size * .62 * s, maxLen = size * .42
  bars.setAttribute("style", `left:${x}px;top:${y}px;width:1px;height:1px`)
  lines.forEach((line, i) => {
    const a = (i / NB) * Math.PI * 2 + t * .25
    const wobble = (Math.sin(i * 1.7 + t * 9) * .5 + .5) * (Math.sin(i * .37 - t * 5) * .5 + .5)
    const len = 4 + maxLen * level * (.35 + .65 * wobble)
    line.setAttribute("x1", Math.cos(a) * r0); line.setAttribute("y1", Math.sin(a) * r0)
    line.setAttribute("x2", Math.cos(a) * (r0 + len)); line.setAttribute("y2", Math.sin(a) * (r0 + len))
    line.setAttribute("stroke", i % 2 ? accent : "#ffffff"); line.setAttribute("stroke-opacity", (.25 + level * .7).toFixed(2))
  })
  // Satellites on tilted orbits (behind the orb when "far").
  sats.forEach((sat, i) => {
    const a = t * (.9 + i * .35) + i * 2.1, rx = size * (.95 + i * .18), ry = size * (.32 + i * .06), tilt = (i - 1) * .5
    const ox = Math.cos(a) * rx, oy = Math.sin(a) * ry, depth = Math.sin(a)
    const sx = ox * Math.cos(tilt) - oy * Math.sin(tilt), sy = ox * Math.sin(tilt) + oy * Math.cos(tilt)
    const d = size * (.075 + .03 * depth) * (size > 100 ? 1 : .7)
    Object.assign(sat.style, { width: `${d}px`, height: `${d}px`, left: `${x + sx - d / 2}px`, top: `${y + sy - d / 2}px`, zIndex: depth > 0 ? 2 : 0, opacity: size < 4 ? 0 : (.55 + .45 * depth).toFixed(2), "--accent": accent })
  })
  presenter.style.setProperty("--accent", accent)
  // Shockwaves on cues.
