# Installed at /opt/kiara/stt. Kiara's speech to text: Whisper (open weights) on the CPU through speaches,
# an OpenAI-compatible server (/v1/audio/transcriptions). Used for WhatsApp voice notes; no paid API.
# Reachable only on 127.0.0.1; the Kiara gateway exposes it as /stt/v1/audio/transcriptions behind the gateway token.
# The model (KIARA_STT_MODEL in the API, default Systran/faster-whisper-small) is downloaded once into ./hf-cache.
services:
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: kiara-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8893:8000"
    environment:
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__TTL=-1
      - ENABLE_UI=false
      - HF_HUB_DISABLE_PROGRESS_BARS=1
    volumes:
      - ./hf-cache:/home/ubuntu/.cache/huggingface/hub
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
