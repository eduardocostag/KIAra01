# Installed at /opt/kiara/video. Kiara's video generation (queue + engines), see server.py.
# Secrets in /opt/kiara/video/.env (root, 0600):
#   KIARA_GATEWAY_TOKEN  same token as the gateway (used to ask Kiara's image models for the first frame)
#   HF_TOKEN             optional, Hugging Face token: more free GPU time and enables Wan 2.2
#   POLLINATIONS_KEY     optional, paid engines (Veo, Seedance, Kling...); POLLINATIONS_MODEL picks one
# Listens only on 127.0.0.1:8891; the gateway exposes it as /video/* behind the gateway token.
services:
  video:
    build: .
    image: kiara-video:1
    container_name: kiara-video
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    mem_limit: 3g
    shm_size: 512m
    cpus: 3
    read_only: true
    tmpfs:
      - /tmp
      - /home/kiara:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
