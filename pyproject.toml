[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiara-assistant"
version = "0.1.0"
description = "Assistente pessoal local-first para Windows"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2",
  "mss>=10.0.0",
  "Pillow>=11.0.0",
  "psutil>=6.1.0",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["PySide6>=6.8"]
voice = ["sounddevice>=0.5", "numpy>=2.1", "faster-whisper>=1.1", "pyttsx3>=2.98"]
openai = ["openai>=1.60"]
browser = ["playwright>=1.49"]
perception = ["pywinauto>=0.6.9", "pytesseract>=0.3.13"]
knowledge = ["pypdf>=5.0"]
release = ["pyinstaller>=6.10"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["windows_integration: safe tests that exercise the local Windows runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
